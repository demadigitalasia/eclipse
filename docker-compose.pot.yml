# ECLIPSE deploy stack for Coolify (Docker Compose resource).
#
# Services:
#   frontend         -> nginx serving the Vite build, proxies /api to the backend
#   eclipse-backend  -> FastAPI (ingest, Gemini analysis, FFmpeg render)
#   bgutil-provider  -> YouTube PO-token provider for yt-dlp
#
# Set these as environment variables on the Coolify resource (never commit them):
#   ALLOWED_ORIGINS, ECLIPSE_MASTER_KEY (optional)
#   ECLIPSE_STORAGE_BACKEND, R2_ACCOUNT_ID, R2_BUCKET_NAME,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   ECLIPSE_EGRESS_PROXY (optional residential/mobile proxy)
#
# The backend points yt-dlp at bgutil-provider automatically.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_FRONTEND_80=eclipse.demadigitalasia.com
    expose:
      - "80"
    depends_on:
      - eclipse-backend

  eclipse-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      ECLIPSE_DATA_DIR: /var/lib/eclipse
      ECLIPSE_PORT: "8000"
      ECLIPSE_ENV: ${ECLIPSE_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://eclipse.demadigitalasia.com}
      ECLIPSE_MASTER_KEY: ${ECLIPSE_MASTER_KEY:-}
      ECLIPSE_STORAGE_BACKEND: ${ECLIPSE_STORAGE_BACKEND:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PREFIX: ${R2_PREFIX:-eclipse}
      R2_PRESIGNED_URL_TTL_SECONDS: ${R2_PRESIGNED_URL_TTL_SECONDS:-300}
      ECLIPSE_EGRESS_PROXY: ${ECLIPSE_EGRESS_PROXY:-}
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      - eclipse-data:/var/lib/eclipse
    expose:
      - "8000"
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    expose:
      - "4416"

volumes:
  eclipse-data:
